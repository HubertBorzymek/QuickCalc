name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test tests/QuickCalc.Core.Tests/QuickCalc.Core.Tests.csproj -c Release

      - name: Build portable package
        shell: pwsh
        run: ./Create-QuickCalc-Release.ps1

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release/QuickCalc-portable-win-x64.zip
          generate_release_notes: true
